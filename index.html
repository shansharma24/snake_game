<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="header">
            <h1>Neon Snake</h1>
            <div class="scoreboard">
                <div class="score-card">
                    <span class="label">SCORE</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-card">
                    <span class="label">HIGH SCORE</span>
                    <span id="high-score" class="value">0</span>
                </div>
            </div>
        </header>

        <main class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="game-over" class="overlay hidden">
                <h2>Game Over</h2>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn" class="glow-button">Play Again</button>
            </div>
        </main>
        
        <!-- Analog Control for Touch Displays -->
        <div class="controls">
            <div class="row">
                <button class="control-btn" id="up">↑</button>
            </div>
            <div class="row">
                <button class="control-btn" id="left">←</button>
                <button class="control-btn" id="down">↓</button>
                <button class="control-btn" id="right">→</button>
            </div>
        </div>

        <footer class="footer">
            <button id="reset" class="glow-button secondary">Reset High Score</button>
            <p>&copy; 2024 Fathur</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
